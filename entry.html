<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment Entry | Payment Portal</title>
    <link rel="stylesheet" href="assets/css/app.css?v=3">
</head>
<body>
    <aside class="sidebar">
        <div class="brand">PAYMENT<span>PORTAL</span></div>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a class="active" href="entry.html">Payment Entry</a>
            <a href="reports.html">Payment Reports</a>
            <a href="agents.html">Agents</a>
            <a href="clients.html">Clients</a>
            <a href="accounts.html">Accounts</a>
            <a href="admin.html">Admin</a>
        </nav>
        <div class="sidebar-footer">
            <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()">
                <span>Theme</span> <strong>Dark</strong>
            </button>
        </div>
    </aside>

    <main class="main">
        <header>
            <div>
                <p class="eyebrow">Transactions</p>
                <h1>Payment Entry Form</h1>
            </div>
        </header>

        <form id="entryForm" class="panel form-grid" autocomplete="off">
            <label>
                Payment Date
                <input name="payment_date" type="date" required>
            </label>
            <label>
                Agent Name
                <input name="agent_name" placeholder="Type to auto-fetch..." required>
            </label>
            <label>
                E-Code
                <input name="ecode" placeholder="Type to auto-fetch...">
            </label>
            <label>
                Ops Manager
                <input name="ops_manager" placeholder="Auto-filled from agent">
            </label>
            <label>
                Team Leader (TL)
                <input name="tl" placeholder="Auto-filled from agent">
            </label>
            <label>
                Client Name
                <input name="client_name" placeholder="Type to auto-fetch...">
            </label>
            <label>
                Client Phone Number
                <input name="client_number" placeholder="10-digit mobile number">
            </label>
            <label>
                Email ID
                <input name="email_id" type="email" placeholder="client@example.com">
            </label>
            <label>
                PAN Number
                <input name="pan_no" placeholder="ABCDE1234F" style="text-transform:uppercase;" maxlength="10">
            </label>
            <label>
                Aadhar Number
                <input name="aadhar_no" placeholder="12-digit Aadhar" maxlength="16">
            </label>
            <label>
                State / Region
                <select name="state">
                    <option value="">Select State / UT</option>
                    <option value="Andhra Pradesh">Andhra Pradesh</option>
                    <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                    <option value="Assam">Assam</option>
                    <option value="Bihar">Bihar</option>
                    <option value="Chhattisgarh">Chhattisgarh</option>
                    <option value="Goa">Goa</option>
                    <option value="Gujarat">Gujarat</option>
                    <option value="Haryana">Haryana</option>
                    <option value="Himachal Pradesh">Himachal Pradesh</option>
                    <option value="Jharkhand">Jharkhand</option>
                    <option value="Karnataka">Karnataka</option>
                    <option value="Kerala">Kerala</option>
                    <option value="Madhya Pradesh">Madhya Pradesh</option>
                    <option value="Maharashtra">Maharashtra</option>
                    <option value="Manipur">Manipur</option>
                    <option value="Meghalaya">Meghalaya</option>
                    <option value="Mizoram">Mizoram</option>
                    <option value="Nagaland">Nagaland</option>
                    <option value="Odisha">Odisha</option>
                    <option value="Punjab">Punjab</option>
                    <option value="Rajasthan">Rajasthan</option>
                    <option value="Sikkim">Sikkim</option>
                    <option value="Tamil Nadu">Tamil Nadu</option>
                    <option value="Telangana">Telangana</option>
                    <option value="Tripura">Tripura</option>
                    <option value="Uttar Pradesh">Uttar Pradesh</option>
                    <option value="Uttarakhand">Uttarakhand</option>
                    <option value="West Bengal">West Bengal</option>
                    <option value="Delhi">Delhi</option>
                    <option value="Chandigarh">Chandigarh</option>
                    <option value="Jammu and Kashmir">Jammu and Kashmir</option>
                    <option value="Ladakh">Ladakh</option>
                    <option value="Puducherry">Puducherry</option>
                    <option value="Other">Other</option>
                </select>
            </label>
            <label>
                Ratio
                <input name="ratio" placeholder="50/50 or 100">
            </label>
            <label>
                Payment Mode
                <select name="payment_mode">
                    <option value="P2P">P2P</option>
                    <option value="D P2P">D P2P</option>
                </select>
            </label>
            <label>
                USDT Amount
                <input name="usdt" type="number" step="0.000001" placeholder="e.g. 1500.80" required>
            </label>
            <label>
                Divided By (Exchange Rate)
                <input name="divided_by" type="number" step="0.000001" value="88" required>
            </label>
            <label>
                INR Amount (Calculated)
                <input name="inr_amount" type="number" step="0.01" readonly placeholder="Auto-calculated (USDT * Rate)">
            </label>
            <label>
                Received In Company
                <select name="received_in">
                    <option value="Digital Verse">Digital Verse</option>
                    <option value="World of Crypto">World of Crypto</option>
                </select>
            </label>
            <label class="wide">
                Reference / Remarks
                <textarea name="remarks" placeholder="Optional notes..."></textarea>
            </label>
            <div class="wide" style="display:flex; align-items:center; gap:14px; margin-top:8px;">
                <button type="submit" class="primary">Save Payment Record</button>
                <span id="entryMsg" style="color:var(--accent); font-weight:600;"></span>
            </div>
        </form>
    </main>

    <script src="assets/js/theme.js"></script>
    <script src="assets/js/api.js?v=5"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/entry.js?v=5"></script>
</body>
</html>
