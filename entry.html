<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment Entry | Payment Portal</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="alternate icon" href="favicon.ico">
    <link rel="stylesheet" href="assets/css/app.css?v=18">
</head>
<body>
    <aside class="sidebar">
        <div class="brand">PAYMENT<span>PORTAL</span></div>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a class="active" href="entry.html">Payment Entry</a>
            <a href="reports.html">Payment Reports</a>
            <a href="agents.html">Agents</a>
            <a href="clients.html">Clients</a>
            <a href="accounts.html">Accounts</a>
            <a href="admin.html">Admin</a>
        </nav>
        <div class="sidebar-footer">
            <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()">
                <span>Theme</span> <strong>Dark</strong>
            </button>
        </div>
    </aside>

    <main class="main">
        <header>
            <div>
                <p class="eyebrow">Transactions</p>
                <h1>Payment Entry Form</h1>
            </div>
        </header>

        <form id="entryForm" class="panel form-grid" autocomplete="off">
            <label>
                Payment Date
                <input name="payment_date" type="date" required>
            </label>
            <label>
                Agent Name
                <div class="omni-input-wrap">
                    <input name="agent_name" id="agent_name" placeholder="Select or type agent name..." required autocomplete="off" spellcheck="false">
                    <div id="agent_name_dropdown" class="omni-dropdown" role="listbox"></div>
                </div>
            </label>
            <label>
                E-Code
                <input name="ecode" id="ecode" placeholder="Auto-filled from agent" readonly style="background:var(--bg-lighter);">
            </label>
            <label>
                Ops Manager
                <input name="ops_manager" id="ops_manager" placeholder="Auto-filled from agent" readonly style="background:var(--bg-lighter);">
            </label>
            <label>
                Team Leader (TL)
                <input name="tl" id="tl" placeholder="Auto-filled from agent" readonly style="background:var(--bg-lighter);">
            </label>
            <label>
                Ratio
                <select name="ratio" id="ratioSelect">
                    <option value="100" selected>100</option>
                    <option value="50/50">50/50</option>
                </select>
            </label>

            <!-- Agent 2 Section for 50/50 Split -->
            <div id="agent2Section" style="display:none; grid-column: 1 / -1; background: var(--bg-lighter); padding: 16px; border-radius: 6px; border: 1px dashed var(--border); margin: 6px 0;">
                <h3 style="margin: 0 0 12px 0; font-size: 13.5px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px;">
                    Agent 2 Details (50/50 Split Share)
                </h3>
                <div class="form-grid" style="margin: 0; padding: 0; border: none; background: transparent;">
                    <label>
                        Agent 2 Name
                        <div class="omni-input-wrap">
                            <input name="agent2_name" id="agent2_name" placeholder="Select or type second agent..." autocomplete="off" spellcheck="false">
                            <div id="agent2_name_dropdown" class="omni-dropdown" role="listbox"></div>
                        </div>
                    </label>
                    <label>
                        Agent 2 E-Code
                        <input name="agent2_ecode" id="agent2_ecode" placeholder="Auto-filled from agent" readonly style="background:var(--surface);">
                    </label>
                    <label>
                        Agent 2 Ops Manager
                        <input name="agent2_ops_manager" id="agent2_ops_manager" placeholder="Auto-filled from agent" readonly style="background:var(--surface);">
                    </label>
                    <label>
                        Agent 2 Team Leader (TL)
                        <input name="agent2_tl" id="agent2_tl" placeholder="Auto-filled from agent" readonly style="background:var(--surface);">
                    </label>
                </div>
            </div>

            <label>
                Client Name
                <div class="omni-input-wrap">
                    <input name="client_name" id="client_name" placeholder="Enter client name..." autocomplete="off" spellcheck="false">
                    <div id="client_name_dropdown" class="omni-dropdown" role="listbox"></div>
                </div>
            </label>
            <label>
                Client Phone Number
                <input name="client_number" id="client_number" type="tel" placeholder="10-digit mobile number" maxlength="10" autocomplete="tel">
                <small style="font-size:11px; color:var(--text-muted); margin-top:2px; display:block;">10-digit Indian mobile (starts with 6, 7, 8, or 9)</small>
            </label>
            <label>
                Payment Mode
                <select name="payment_mode">
                    <option value="P2P">P2P</option>
                    <option value="D P2P">D P2P</option>
                </select>
            </label>
            <label>
                USDT Amount
                <input name="usdt" type="number" step="0.000001" placeholder="e.g. 1500.80" required>
            </label>
            <label>
                Divided By (Exchange Rate)
                <input name="divided_by" type="number" step="0.000001" value="88" readonly style="background:var(--bg-lighter); cursor:not-allowed;" required title="Exchange rate is locked to 88">
            </label>
            <label>
                INR Amount (Calculated)
                <input name="inr_amount" type="number" step="0.01" readonly placeholder="Auto-calculated (USDT * 88)" style="background:var(--bg-lighter); font-weight:700; color:var(--accent);">
            </label>
            <label>
                Received In Company
                <select name="received_in" id="received_in" required>
                    <option value="Digital Verse" selected>Digital Verse</option>
                    <option value="World of Krypto">World of Krypto</option>
                </select>
            </label>
            <label class="wide">
                Reference / Remarks
                <textarea name="remarks" placeholder="Optional notes..."></textarea>
            </label>
            <div class="wide" style="display:flex; align-items:center; gap:14px; margin-top:8px;">
                <button type="submit" class="primary">Save Payment Record</button>
                <span id="entryMsg" style="color:var(--accent); font-weight:600;"></span>
            </div>
        </form>
    </main>

    <script src="assets/js/theme.js"></script>
    <script src="assets/js/api.js?v=18"></script>
    <script src="assets/js/auth.js?v=18"></script>
    <script src="assets/js/entry.js?v=18"></script>
</body>
</html>
