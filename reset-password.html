<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password | Payment Portal</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="alternate icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/app.css?v=20">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg);
            font-family: var(--font-sans);
            padding: 20px;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }
        .reset-box {
            background: var(--surface);
            padding: 40px 36px;
            border-radius: 14px;
            border: 1px solid var(--line);
            box-shadow: 0 16px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
        }
        .reset-box h1 {
            font-family: var(--font-heading) !important;
            font-size: 26px;
            font-weight: 800;
            margin: 0 0 8px 0;
            color: var(--text);
            letter-spacing: -0.4px;
        }
        .reset-box p {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0 0 24px 0;
            line-height: 1.5;
        }
        .reset-box form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .reset-box label {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }
        .reset-box input {
            padding: 12px 14px;
            border: 1px solid var(--line2);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s ease;
        }
        .reset-box input:focus {
            border-color: var(--accent);
        }
        .reset-box button {
            margin-top: 6px;
            padding: 12px;
            background: var(--accent);
            color: var(--accent-btn-text);
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .reset-box button:hover {
            background: var(--accent-hover);
        }
        #resetMsg {
            font-size: 13.5px;
            text-align: center;
            min-height: 20px;
            margin-top: 10px;
        }
    </style>
</head>
<body class="light">
    <div class="reset-box">
        <h1>Set New Password</h1>
        <p>Enter the security verification code or token sent to your email, along with your new password.</p>

        <form id="resetForm" autocomplete="off">
            <input type="hidden" id="tokenInput">

            <div id="otpGroup">
                <label>
                    6-Digit Verification Code (from Email)
                    <input type="text" id="otpInput" placeholder="e.g. 583921" maxlength="10" autocomplete="one-time-code">
                </label>
            </div>

            <label>
                New Password
                <input type="password" id="newPassword" placeholder="Minimum 6 characters" required autocomplete="new-password">
            </label>

            <label>
                Confirm New Password
                <input type="password" id="confirmPassword" placeholder="Re-enter new password" required autocomplete="new-password">
            </label>

            <button type="submit" id="submitResetBtn">Update Password</button>

            <div id="resetMsg"></div>

            <div style="text-align:center; margin-top:16px;">
                <a href="login.html" style="font-size:13px; color:var(--text-muted); text-decoration:none;">&larr; Back to Login</a>
            </div>
        </form>
    </div>

    <script src="assets/js/theme.js"></script>
    <script src="assets/js/api.js?v=20"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const urlToken = params.get('token') || '';
        const tokenInput = document.getElementById('tokenInput');
        const otpGroup = document.getElementById('otpGroup');
        const otpInput = document.getElementById('otpInput');
        const resetForm = document.getElementById('resetForm');
        const newPassword = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmPassword');
        const submitResetBtn = document.getElementById('submitResetBtn');
        const resetMsg = document.getElementById('resetMsg');

        if (urlToken) {
            tokenInput.value = urlToken;
            if (otpGroup) otpGroup.style.display = 'none';
        }

        resetForm.onsubmit = async (e) => {
            e.preventDefault();
            resetMsg.textContent = '';
            resetMsg.style.color = 'var(--text-muted)';

            const pwd = newPassword.value;
            const confirm = confirmPassword.value;

            if (pwd.length < 6) {
                resetMsg.textContent = 'Password must be at least 6 characters long.';
                resetMsg.style.color = 'var(--danger)';
                return;
            }

            if (pwd !== confirm) {
                resetMsg.textContent = 'Passwords do not match.';
                resetMsg.style.color = 'var(--danger)';
                return;
            }

            const token = tokenInput.value.trim();
            const otp = otpInput ? otpInput.value.trim() : '';

            if (!token && !otp) {
                resetMsg.textContent = 'Please enter the verification code sent to your email.';
                resetMsg.style.color = 'var(--danger)';
                return;
            }

            submitResetBtn.disabled = true;
            resetMsg.textContent = 'Updating password...';

            try {
                const res = await api('reset_password', {
                    token: token,
                    otp: otp,
                    password: pwd
                });

                resetMsg.textContent = res.message || 'Password updated successfully! Redirecting to login...';
                resetMsg.style.color = 'var(--accent)';
                setTimeout(() => {
                    location.href = 'login.html';
                }, 2000);
            } catch (err) {
                resetMsg.textContent = err.message || 'Failed to reset password. Please check your token/code.';
                resetMsg.style.color = 'var(--danger)';
                submitResetBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
